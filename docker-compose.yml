services:
  db:
    image: postgres:16-alpine
    container_name: mantis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mantis}
      POSTGRES_USER: ${POSTGRES_USER:-mantis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mantis}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file:
      - .env
    container_name: mantis-discord-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - __pycache__/
            - "*.pyc"
            - requirements.txt
            - Dockerfile
            - docker-compose.yml
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

volumes:
  postgres_data:
